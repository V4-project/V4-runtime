name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Format check for all code
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format
        pip install cmake-format

    - name: Check formatting
      run: make format-check

    - name: Check dependency and build paths without hardware
      run: python3 -m unittest discover -s tests/build_paths -v

  # Detect changes to determine which jobs to run
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      esp32c6: ${{ steps.filter.outputs.esp32c6 }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            esp32c6:
              - 'bsp/esp32c6/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # Build ESP32-C6 runtime
  build-esp32c6:
    name: Build ESP32-C6 (${{ matrix.board }})
    needs: changes
    if: needs.changes.outputs.esp32c6 == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [nanoc6]

    steps:
    - uses: actions/checkout@v5

    - name: Checkout tested V4-engine dependency
      uses: actions/checkout@v5
      with:
        repository: V4-project/V4-engine
        ref: a7eb42611170091c72b7a17799b57c13f62fa6d1
        path: bsp/esp32c6/runtime/_deps/V4-engine

    - name: Checkout tested V4-hal dependency
      uses: actions/checkout@v5
      with:
        repository: V4-project/V4-hal
        ref: 01fa2b3acf2b24fb9cf898b0916e3719871dbe3f
        path: bsp/esp32c6/runtime/_deps/V4-hal

    - name: Checkout tested V4-link dependency
      uses: actions/checkout@v5
      with:
        repository: V4-project/V4-link
        ref: d155eefabda98ca6716cbe0f81dd8e602d41c990
        path: bsp/esp32c6/runtime/_deps/V4-link

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.5
        target: esp32c6
        path: 'bsp/esp32c6/runtime'

    - name: Archive firmware
      uses: actions/upload-artifact@v6
      with:
        name: esp32c6-${{ matrix.board }}-firmware
        path: |
          bsp/esp32c6/runtime/build/*.bin
          bsp/esp32c6/runtime/build/*.elf
          bsp/esp32c6/runtime/build/*.map
          bsp/esp32c6/runtime/build/project_description.json
          bsp/esp32c6/runtime/sdkconfig
        retention-days: 7
