# Docker Compose configuration for V4 RTOS ESP32-C6 development
# Provides ESP-IDF v5.5.5 development environment

services:
  esp-idf:
    image: espressif/idf:v5.5.5
    volumes:
      # Mount V4-runtime project directory
      - ../../:/project
      # Mount V4-engine (required for VM core)
      - ../../../V4-engine:/v4-engine:ro
      # Mount V4-hal (required for HAL implementation)
      - ../../../V4-hal:/v4-hal:ro
      # Mount V4-link (required for bytecode protocol)
      - ../../../V4-link:/v4-link:ro
    environment:
      # Set V4 paths for build system
      - V4_ENGINE_PATH=/v4-engine
      - V4_HAL_PATH=/v4-hal
      - V4_LINK_PATH=/v4-link
    working_dir: /project/bsp/esp32c6/runtime
    command: /bin/bash
    tty: true
    stdin_open: true
    # Add docker-compose.device.yml only when flashing/monitoring real hardware.
    privileged: false
    network_mode: bridge
